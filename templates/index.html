<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FedCert</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <script src="https://kit.fontawesome.com/960f50b335.js" crossorigin="anonymous"></script>
  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      padding: 2rem;
      padding-bottom: 70px; /* reserve space for footer */
    }
    .container { max-width: 800px; margin: auto; }
    .spinner {
      display: none;
      width: 40px; height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
    footer.sticky-footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 50px;
      background: #fff;
      border-top: 1px solid #dee2e6;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    footer.sticky-footer a {
      color: #6c757d;
      text-decoration: none;
    }

    /* FedCert result card styles */
    .cert-result-card {
      background: #fff;
      border: 1px solid #dee2e6;
      border-left: 4px solid #3498db;
      border-radius: 0.375rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .cert-result-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .cert-result-title { margin: 0 0 0.25rem 0; font-size: 1.05rem; }
    .cert-result-title a { color: inherit; text-decoration: none; }
    .cert-result-title a:hover { text-decoration: underline; }
    .cert-result-meta { font-size: 0.875rem; color: #6c757d; margin-bottom: 0.5rem; }
    .cert-score-badge {
      flex-shrink: 0;
      background: #3498db; color: #fff;
      padding: 0.25rem 0.6rem; border-radius: 0.25rem;
      font-weight: 600; font-size: 0.95rem;
      white-space: nowrap;
    }
    .cert-score-badge.weak { background: #6c757d; }
    .cert-eligibility-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 0.25rem;
      margin-bottom: 0.5rem;
      background: #e9ecef; color: #495057;
    }
    .cert-eligibility-tag.open_to_public { background: #d1e7dd; color: #0a3622; }
    .cert-eligibility-tag.status_qualified { background: #cfe2ff; color: #084298; }
    .cert-eligibility-tag.veterans_qualified { background: #fff3cd; color: #664d03; }
    .cert-match-reason { font-size: 0.95rem; margin: 0.5rem 0 0 0; }
    .cert-gaps-toggle { font-size: 0.85rem; color: #3498db; cursor: pointer; user-select: none; margin-top: 0.5rem; }
    .cert-gaps { font-size: 0.85rem; color: #495057; margin-top: 0.5rem; padding-left: 1.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center">
      <i class="fa-solid fa-bullseye text-primary me-1" style="font-size: 2.25rem;"></i><strong>FedCert</strong>
    </h1>
    <p class="text-center text-muted">
      Paste your resume. Get a short, honest list of currently-open federal
      jobs that actually fit your background.
    </p>

    <label for="resume" class="mt-3"><strong>Paste your resume:</strong></label>
    <textarea id="resume" class="form-control mb-3" rows="10"
              placeholder="Paste the full text of your resume here..."></textarea>

    <label for="certPrompt" class="form-label">
      <strong>Optional:</strong> tell FedCert what kind of role you're looking for
    </label>
    <textarea id="certPrompt" class="form-control mb-3" rows="2"
      placeholder="e.g. cybersecurity, AI policy, acquisition strategy"></textarea>

    <button id="certRunBtn" class="btn btn-primary w-100">
      <strong>Run FedCert</strong>
    </button>

    <div id="certStatusStrip" class="text-center my-3" style="display: none;">
      <div class="spinner" style="display: inline-block;"></div>
      <p id="certStatusMessage" class="mt-2 mb-0 text-muted"></p>
    </div>

    <div id="certError" class="alert alert-warning mt-3" style="display: none;"></div>

    <div id="certProfileSummary" class="alert alert-info mt-3" style="display: none;"></div>

    <div id="certResults" class="mt-3"></div>

    <div class="mt-5 text-center">
      <a href="mailto:billsantry@gmail.com?subject=FedCert%20Feedback"
         class="btn btn-outline-dark">
        💬 Report Comments, Compliments or Bugs
      </a>
    </div>
  </div>

  <footer class="sticky-footer">
    <p>&copy; <a href="mailto:billsantry@gmail.com">Bill Santry</a></p>
  </footer>

  <script src="{{ url_for('static', filename='cert.js') }}"></script>
</body>
</html>
